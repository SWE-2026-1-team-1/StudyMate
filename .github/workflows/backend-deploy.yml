name: Backend Deploy

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/studymate-backend  # ghcr.io/<owner>/studymate-backend

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image 태그 결정 (short SHA)
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 레지스트리 이름 lowercase 변환
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: docker-compose.prod.yml 전송
        run: |
          scp backend/docker-compose.prod.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/studymate/docker-compose.prod.yml

      - name: 레지스트리 이름 lowercase 변환
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인 + 이미지 풀 + 재기동
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          # github.sha 는 full 40자 → workflow 단계에서 같은 short 로 자르기
          SHORT_TAG="sha-${GITHUB_SHA::7}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${SHORT_TAG}"

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "set -e; \
             echo '$GHCR_TOKEN' | docker login ${{ env.REGISTRY }} -u '$GHCR_USER' --password-stdin; \
             cd /home/ubuntu/studymate; \
             IMAGE_TAG=${SHORT_TAG} docker compose -f docker-compose.prod.yml pull; \
             IMAGE_TAG=${SHORT_TAG} docker compose -f docker-compose.prod.yml up -d; \
             docker image prune -f; \
             docker logout ${{ env.REGISTRY }}"

      - name: 헬스체크
        run: |
          for i in {1..18}; do
            if curl -sf http://${{ secrets.EC2_HOST }}:8080/actuator/health; then
              echo "헬스체크 통과"
              exit 0
            fi
            echo "대기 중... ($i/18)"
            sleep 10
          done
          echo "헬스체크 실패 — EC2 에서 'docker compose logs app' 확인"
          exit 1
