name: Backend Deploy

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build JAR (테스트 제외)
        working-directory: backend
        run: ./gradlew bootJar -x test

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: JAR 전송
        run: |
          scp backend/build/libs/studymate-*.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/studymate/studymate.jar

      - name: 서비스 재시작
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart studymate && sudo systemctl status studymate --no-pager"

      - name: 헬스체크
        run: |
          for i in {1..12}; do
            if curl -sf http://${{ secrets.EC2_HOST }}:8080/actuator/health; then
              echo "헬스체크 통과"
              exit 0
            fi
            echo "대기 중... ($i/12)"
            sleep 10
          done
          echo "헬스체크 실패 — 서비스 기동 확인 필요"
          exit 1
