name: Frontend Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'deploy/Caddyfile'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: SPA 빌드
        working-directory: frontend
        run: npm run build

      - name: 산출물 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 산출물 다운로드
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: SPA 산출물 동기화 (rsync)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/studymate/

      - name: Caddyfile 전송 + 검증 + reload
        run: |
          scp deploy/Caddyfile \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/Caddyfile.new
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -se <<'EOF'
          set -e
          # 문법 검증
          caddy validate --config /tmp/Caddyfile.new --adapter caddyfile
          sudo mv /tmp/Caddyfile.new /etc/caddy/Caddyfile
          sudo systemctl reload caddy
          EOF

      - name: 헬스체크 (SPA)
        run: |
          for i in {1..12}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://${{ secrets.EC2_HOST }}/)
            if [ "$code" = "200" ]; then
              echo "SPA 200 OK"
              exit 0
            fi
            echo "대기 중... ($i/12) status=$code"
            sleep 5
          done
          echo "헬스체크 실패"
          exit 1
